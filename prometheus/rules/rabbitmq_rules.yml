groups:
  - name: rabbitmq
    rules:
      - alert: RabbitMQDown
        # See JenkinsDown: `job` is the collector kind, `service` is identity.
        # Requires `monitoring.service: "rabbitmq"` on the container.
        expr: up{job="app", service="rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ down on {{ $labels.host }}"
          description: "RabbitMQ on {{ $labels.host }} has been unreachable for 2m."

      - alert: RabbitMQNoConsumers
        # Dead-letter queues have no consumer by design; RabbitMQDeadLettered
        # covers them. Both rules carry the same DLQ name regex: dlq_x, x_dlq,
        # x_dlq_y, x.dead-letter, x_deadletter_y (any of `._-`, any case).
        expr: |
          rabbitmq_queue_consumers{queue!~"(?i)(.*[._-])?(dlq|dead[._-]?letter)([._-].*)?"} == 0
            and rabbitmq_queue_messages{queue!~"(?i)(.*[._-])?(dlq|dead[._-]?letter)([._-].*)?"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue '{{ $labels.queue }}' has messages but no consumers"
          description: "Queue '{{ $labels.queue }}' on {{ $labels.host }} has held messages with zero consumers for 5m."

      - alert: RabbitMQDeadLettered
        # New dead letters, not standing ones: fires while the DLQ holds more
        # than it did 15m ago, so one batch of failures alerts once and a
        # DLQ nobody has drained yet stays quiet.
        expr: |
          rabbitmq_queue_messages{queue=~"(?i)(.*[._-])?(dlq|dead[._-]?letter)([._-].*)?"}
            > rabbitmq_queue_messages{queue=~"(?i)(.*[._-])?(dlq|dead[._-]?letter)([._-].*)?"} offset 15m
        labels:
          severity: warning
        annotations:
          summary: "New dead letters in RabbitMQ queue '{{ $labels.queue }}'"
          description: "Dead-letter queue '{{ $labels.queue }}' on {{ $labels.host }} grew to {{ $value }} messages in the last 15m: messages are failing to be processed."

      - alert: RabbitMQQueueBacklog
        # Threshold generous; tighten per-queue in project overlays if needed.
        expr: rabbitmq_queue_messages > 10000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue '{{ $labels.queue }}' > 10k messages"
          description: "Queue '{{ $labels.queue }}' on {{ $labels.host }} has held >10,000 messages for 15m."

      - alert: RabbitMQDiskLow
        expr: rabbitmq_disk_space_available_bytes < 5 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ disk space < 5 GB on {{ $labels.host }}"
          description: "RabbitMQ data disk has <5 GB free on {{ $labels.host }} for 5m."
