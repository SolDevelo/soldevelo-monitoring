groups:
  - name: jvm
    rules:
      - alert: JvmHeapPressure
        # Sustained heap pressure over 85% — the leading indicator for OOM.
        # In a healthy app heap oscillates with GC; sitting at >85% for 10m
        # means the GC can't free enough — almost always a leak or undersize.
        expr: |
          sum by (app, deployment, environment, service, host) (jvm_memory_used_bytes{area="heap"})
            / sum by (app, deployment, environment, service, host) (jvm_memory_max_bytes{area="heap"} > 0) > 0.85
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "JVM heap > 85% on {{ $labels.service }}"
          description: "Heap on '{{ $labels.service }}' ({{ $labels.host }}) is above 85% for 10m."

      - alert: JvmGCThrashing
        # >25% of wall-clock time spent in GC — classic 'about to OOM' signal.
        expr: |
          sum by (app, deployment, environment, service, host) (rate(jvm_gc_pause_seconds_sum[5m])) > 0.25
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "JVM GC thrashing on {{ $labels.service }}"
          description: "'{{ $labels.service }}' on {{ $labels.host }} spent >25% of wall-clock time in GC for 5m."

      - alert: JvmMetaspacePressure
        # Metaspace OOM is rarer but real — apps that load many classes
        # (dynamic proxies, code generation) can exhaust Metaspace without
        # ever filling heap.
        expr: |
          sum by (app, deployment, environment, service, host) (jvm_memory_used_bytes{area="nonheap",id=~".*[Mm]etaspace.*"})
            / sum by (app, deployment, environment, service, host) (jvm_memory_max_bytes{area="nonheap",id=~".*[Mm]etaspace.*"} > 0) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM Metaspace > 90% on {{ $labels.service }}"
          description: "Metaspace on '{{ $labels.service }}' ({{ $labels.host }}) is above 90% for 10m."

      - alert: JvmThreadGrowth
        # Threads should reach a stable level after warmup. Sustained growth
        # is usually an unbounded thread pool / thread leak.
        expr: |
          (jvm_threads_live_threads - jvm_threads_live_threads offset 1h) > 50
            and jvm_threads_live_threads > 100
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "JVM thread count growing on {{ $labels.service }}"
          description: "'{{ $labels.service }}' on {{ $labels.host }} added >50 live threads over the last 1h and is now above 100."

      - alert: JvmScrapeDown
        expr: up{job="java"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "JVM scrape failing on {{ $labels.service }}"
          description: "Prometheus cannot scrape '{{ $labels.instance }}' (service={{ $labels.service }}) for 2m."

      - alert: HttpServerErrorRateHigh
        # Micrometer's `outcome` label buckets responses; SERVER_ERROR is 5xx.
        expr: |
          sum by (app, deployment, environment, service, host) (rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[5m]))
            / sum by (app, deployment, environment, service, host) (rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx rate > 1% on {{ $labels.service }}"
          description: "'{{ $labels.service }}' on {{ $labels.host }} served >1% 5xx responses over 5m."

      - alert: HttpClientErrorRateHigh
        # 4xx often includes expected traffic (bad input, auth); threshold gentler.
        expr: |
          sum by (app, deployment, environment, service, host) (rate(http_server_requests_seconds_count{outcome="CLIENT_ERROR"}[5m]))
            / sum by (app, deployment, environment, service, host) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 4xx rate > 5% on {{ $labels.service }}"
          description: "'{{ $labels.service }}' on {{ $labels.host }} served >5% 4xx responses over 10m."

      - alert: HttpLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (app, deployment, environment, service, host, le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP p95 latency > 2s on {{ $labels.service }}"
          description: "'{{ $labels.service }}' on {{ $labels.host }} has p95 request latency above 2s for 5m."

      - alert: HikariCPPoolExhausted
        # Pending > 0 means threads are waiting for connections — pool saturated.
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HikariCP pool saturated on {{ $labels.service }} (pool={{ $labels.pool }})"
          description: "Pool '{{ $labels.pool }}' on '{{ $labels.service }}' ({{ $labels.host }}) has queued pending connections for 2m."
