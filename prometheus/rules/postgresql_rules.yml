groups:
  - name: postgresql
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL down on {{ $labels.host }}"
          description: "PostgreSQL on {{ $labels.host }} has been unreachable for 2m."

      - alert: PostgreSQLTooManyConnections
        # >85% of max_connections used, sustained — sizing issue or leak.
        expr: |
          sum by (app, deployment, environment, host) (pg_stat_database_numbackends)
            / max by (app, deployment, environment, host) (pg_settings_max_connections) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections > 85% of max on {{ $labels.host }}"
          description: "PostgreSQL on {{ $labels.host }} has held >85% of max_connections for 10m."

      - alert: PostgreSQLLowCacheHitRatio
        # <90% hit ratio sustained — working set outgrew shared_buffers or a
        # query is doing full scans.
        expr: |
          sum by (app, deployment, environment, host) (rate(pg_stat_database_blks_hit[10m]))
            / (sum by (app, deployment, environment, host) (rate(pg_stat_database_blks_hit[10m])) + sum by (app, deployment, environment, host) (rate(pg_stat_database_blks_read[10m]))) < 0.9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL cache hit ratio < 90% on {{ $labels.host }}"
          description: "Cache hit ratio on {{ $labels.host }} has been below 90% for 30m."

      - alert: PostgreSQLDeadlocks
        # Sustained deadlock rate usually indicates a lock-ordering bug.
        expr: rate(pg_stat_database_deadlocks[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks on {{ $labels.host }} db '{{ $labels.datname }}'"
          description: "Deadlock rate on '{{ $labels.datname }}' ({{ $labels.host }}) has been above zero for 5m."

      - alert: PostgreSQLReplicationLag
        # Requires postgres_exporter's replication collector running against
        # the primary. 900s = 15min matches the common "replica lag" shape.
        expr: pg_replication_lag > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL replica lag > 15m on {{ $labels.host }}"
          description: "Replica {{ $labels.host }} is {{ $value | humanizeDuration }} behind the primary."

      - alert: PostgreSQLReplicationSlotInactive
        # Nothing consumes the slot, so WAL piles up until max_slot_wal_keep_size
        # invalidates it. Early warning for PostgreSQLReplicationSlotLost.
        expr: pg_replication_slots_slot_is_active == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Replication slot '{{ $labels.slot_name }}' inactive on {{ $labels.host }}"
          description: "No consumer has been attached to slot '{{ $labels.slot_name }}' for 30m; WAL is accumulating. Restart its consumer (e.g. the Debezium connector) before the slot is invalidated."

      - alert: PostgreSQLReplicationSlotLost
        # The WAL the consumer needs is gone; it cannot resume. Recovery is
        # drop the slot + re-snapshot (reporting stack: `make recover-slot`).
        expr: pg_replication_slots_wal_status{wal_status="lost"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Replication slot '{{ $labels.slot_name }}' invalidated on {{ $labels.host }}"
          description: "Slot '{{ $labels.slot_name }}' fell behind max_slot_wal_keep_size and its WAL was removed (wal_status=lost). Its consumer cannot resume: drop the slot and re-snapshot."
