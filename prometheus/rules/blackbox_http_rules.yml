groups:
  - name: blackbox
    rules:
      # Untagged probes. Probes tagged with a `check` label (public / app-direct /
      # service) are handled by AppDown / PublicUrlUnreachable / ServiceUnreachable
      # below.
      - alert: ProbeFailing
        expr: probe_success{check=""} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP probe failing: {{ $labels.instance }}"
          description: "Blackbox HTTP probe to {{ $labels.instance }} has been failing for 2m."

      # app-direct probe bypasses the public DNS, so a failure here is the app itself.
      - alert: AppDown
        expr: probe_success{check="app-direct"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Application down: {{ $labels.deployment }}/{{ $labels.environment }}"
          description: "The app-direct probe ({{ $labels.instance }}), which bypasses the public DNS, has been failing for 2m — the application itself is unreachable."

      # One probe per service behind the app's entry point (`check: service`, plus a
      # `service` label), e.g. <load balancer>/<service>. Reported only while the
      # app-direct probe of the same app/deployment/environment succeeds. That probe
      # hits the load-balancer root, which the web server usually serves from the UI,
      # so it shows that the load balancer and UI answer, not every backend: if
      # routing to all services breaks, every service probe fires (grouped into one
      # notification per environment) and AppDown stays quiet.
      #
      # `for: 10m`, as ServiceDown: in a full redeploy the load balancer and UI are
      # back within a minute or two, which ends the suppression, while the services
      # behind them can take minutes more to answer (a Spring Boot one takes
      # 60-120s). The same `for` makes this alert fire no later than ServiceDown
      # (10m) and ServiceAbsent (30m), so the inhibition in alertmanager.yml can
      # mute both for the same service while this one fires.
      - alert: ServiceUnreachable
        expr: |
          probe_success{check="service"} == 0
            unless on (app, deployment, environment) (probe_success{check="app-direct"} == 0)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Service unreachable: {{ $labels.service }} ({{ $labels.environment }})"
          description: "The probe of {{ $labels.instance }} has failed for 10m while the load balancer and UI still answer. '{{ $labels.service }}' is down or no longer routed."

      # Public URL down while the app is up = DNS/edge issue outside our control.
      - alert: PublicUrlUnreachable
        expr: probe_success{check="public"} == 0 and on (environment, deployment) probe_success{check="app-direct"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Public URL unreachable, app is up: {{ $labels.deployment }}/{{ $labels.environment }}"
          description: "The public URL probe ({{ $labels.instance }}) is failing while the app-direct probe succeeds for 5m — likely a DNS/edge issue outside our control, not an application outage."

      - alert: ProbeSlow
        expr: probe_duration_seconds > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP probe slow: {{ $labels.instance }}"
          description: "Blackbox HTTP probe to {{ $labels.instance }} took >3s for 5m."

      # Service probes (`check: service`) go through the same entry point, so the
      # same certificate, as the deployment's public or app-direct probe. Counting
      # them would turn one expiring certificate into a warning per service.
      - alert: SSLCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{check!="service"} - time() < 14 * 24 * 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SSL cert expiring soon: {{ $labels.instance }}"
          description: "Certificate for {{ $labels.instance }} expires in less than 14 days."
