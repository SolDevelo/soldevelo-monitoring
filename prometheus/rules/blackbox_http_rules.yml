groups:
  - name: blackbox
    rules:
      # Untagged probes. Probes tagged with a `check` label (public / app-direct)
      # are handled by AppDown / PublicUrlUnreachable below.
      - alert: ProbeFailing
        expr: probe_success{check=""} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP probe failing: {{ $labels.instance }}"
          description: "Blackbox HTTP probe to {{ $labels.instance }} has been failing for 2m."

      # app-direct probe bypasses the public DNS, so a failure here is the app itself.
      - alert: AppDown
        expr: probe_success{check="app-direct"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Application down: {{ $labels.deployment }}/{{ $labels.environment }}"
          description: "The app-direct probe ({{ $labels.instance }}), which bypasses the public DNS, has been failing for 2m — the application itself is unreachable."

      # Public URL down while the app is up = DNS/edge issue outside our control.
      - alert: PublicUrlUnreachable
        expr: probe_success{check="public"} == 0 and on (environment, deployment) probe_success{check="app-direct"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Public URL unreachable, app is up: {{ $labels.deployment }}/{{ $labels.environment }}"
          description: "The public URL probe ({{ $labels.instance }}) is failing while the app-direct probe succeeds for 5m — likely a DNS/edge issue outside our control, not an application outage."

      - alert: ProbeSlow
        expr: probe_duration_seconds > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP probe slow: {{ $labels.instance }}"
          description: "Blackbox HTTP probe to {{ $labels.instance }} took >3s for 5m."

      - alert: SSLCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SSL cert expiring soon: {{ $labels.instance }}"
          description: "Certificate for {{ $labels.instance }} expires in less than 14 days."
