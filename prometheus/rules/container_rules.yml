groups:
  - name: containers
    rules:
      - alert: ContainerAbsent
        # cAdvisor drops the series entirely when a container is removed — the
        # value never ages, so the old `time() - container_last_seen > 300`
        # form could not fire (observed staleness peaks at ~60s).
        #
        # Aggregating to `name` is what makes this safe: container_last_seen
        # also carries `id` and `image`, and Docker mints a new id on every
        # recreate. Left in, every redeploy would orphan a series and pin this
        # alert firing for the full 2h window.
        #
        # Scoped to compose-managed, long-lived containers. A bare `docker run`
        # (no compose project) or a `docker-compose run` one-off is expected to
        # exit — alerting on its disappearance is noise, and Docker's random
        # names mean every one is a fresh series that never resolves.
        expr: |
          max by (app, deployment, environment, host, name) (
            max_over_time(container_last_seen{name!="", container_label_com_docker_compose_project!="", container_label_com_docker_compose_oneoff!="True"}[2h])
          )
          unless
          max by (app, deployment, environment, host, name) (
            container_last_seen{name!="", container_label_com_docker_compose_project!="", container_label_com_docker_compose_oneoff!="True"}
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Container gone: {{ $labels.name }} on {{ $labels.host }}"
          description: "'{{ $labels.name }}' was running on {{ $labels.host }} within the last 2h and is no longer reported by cAdvisor."

      - alert: ContainerHighMemoryVsLimit
        # for: 15m (not 5m) prevents flapping when memory oscillates around
        # the threshold — brief dips below reset the timer.
        expr: |
          container_memory_usage_bytes{name!=""}
            / (container_spec_memory_limit_bytes{name!=""} > 0) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} memory > 90% of limit"
          description: "'{{ $labels.name }}' on {{ $labels.host }} has been above 90% of its memory limit for 15m."

      - alert: ContainerOOMKilled
        # cAdvisor OOM counter silently misses fast restart cycles on cgroup
        # v2 — pair with ContainerRestartLoop for robust coverage.
        expr: increase(container_oom_events_total{name!=""}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Container OOM-killed: {{ $labels.name }} on {{ $labels.host }}"
          description: "Kernel OOM-killed a process in container '{{ $labels.name }}' on {{ $labels.host }} within the last 5m."

      - alert: ContainerRestartLoop
        # Each Docker restart creates a new container ID; >2 distinct IDs in
        # 10m means 3+ instances. Catches OOM (when ContainerOOMKilled misses
        # on cgroup v2), healthcheck failures, and crash-on-startup uniformly.
        expr: |
          count by (app, deployment, environment, name, host) (
            count_over_time(container_start_time_seconds{name!=""}[10m])
          ) > 2
        labels:
          severity: critical
        annotations:
          summary: "Container restart loop: {{ $labels.name }} on {{ $labels.host }}"
          description: "'{{ $labels.name }}' on {{ $labels.host }} has started 3+ times in the last 10m."
