# Unit tests for the absence rules. These are the rules whose failure mode is
# silence — a broken one looks exactly like a healthy system — so their
# semantics are pinned here.
#
# Run: promtool test rules prometheus/tests/*.yml   (wired into bin/validate.sh)
rule_files:
  - ../rules/service_rules.yml
  - ../rules/container_rules.yml

evaluation_interval: 1m

tests:
  # A scraped target that starts failing. Classic `up == 0`.
  - interval: 1m
    name: ServiceDown fires when the scrape fails but the target is still discovered
    input_series:
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="reports",instance="reports"}'
        values: "1+0x20 0+0x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: ServiceDown
        exp_alerts: []          # inside `for: 10m`, not yet firing
      - eval_time: 35m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              alertname: ServiceDown
              severity: warning
              job: app
              app: acme
              deployment: d1
              environment: prod
              host: h1
              service: reports
              instance: reports
            exp_annotations:
              summary: "Service not scrapeable: reports (prod)"
              description: "Prometheus has been unable to scrape 'reports' on h1 for 10m. The container is up — the metrics endpoint is not answering."

  # The case `up == 0` structurally cannot catch: the target stops being
  # scraped at all, so there is no series left to compare against zero.
  - interval: 1m
    name: ServiceAbsent fires when the target stops being scraped entirely
    input_series:
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="reports",instance="reports"}'
        values: "1+0x60 _x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: ServiceAbsent
        exp_alerts: []          # still reporting
      - eval_time: 80m
        alertname: ServiceAbsent
        exp_alerts: []          # absent, but inside `for: 30m`
      - eval_time: 100m
        alertname: ServiceAbsent
        exp_alerts:
          - exp_labels:
              alertname: ServiceAbsent
              severity: warning
              app: acme
              deployment: d1
              environment: prod
              host: h1
              service: reports
              instance: reports
            exp_annotations:
              summary: "Service instance stopped reporting: reports/reports (prod)"
              description: "'reports' of 'reports' on h1 was being scraped within the last 2h and no longer is, and nothing replaced it: the service runs fewer instances than its 2h median."

  # Docker: compose names are stable, so a lost replica is named in the alert.
  - interval: 1m
    name: ServiceAbsent names the one replica that is gone while the others run
    input_series:
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper"}'
        values: "1+0x120"
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-2"}'
        values: "1+0x60 _x60"
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-3"}'
        values: "1+0x120"
    alert_rule_test:
      - eval_time: 100m
        alertname: ServiceAbsent
        exp_alerts:
          - exp_labels:
              alertname: ServiceAbsent
              severity: warning
              app: acme
              deployment: d1
              environment: prod
              host: h1
              service: scraper
              instance: scraper-2
            exp_annotations:
              summary: "Service instance stopped reporting: scraper/scraper-2 (prod)"
              description: "'scraper-2' of 'scraper' on h1 was being scraped within the last 2h and no longer is, and nothing replaced it: the service runs fewer instances than its 2h median."

  # Kubernetes: a rollout replaces every pod name. The old names are absent,
  # but the count is back to normal, so nothing is missing. The overlap (6
  # pods for 2m) must not raise the baseline either.
  - interval: 1m
    name: ServiceAbsent stays quiet across a rollout that renames every replica
    input_series:
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-7fc4-a"}'
        values: "1+0x60 _x60"
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-7fc4-b"}'
        values: "1+0x60 _x60"
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-7fc4-c"}'
        values: "1+0x60 _x60"
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-7677-d"}'
        values: "_x59 1+0x61"
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-7677-e"}'
        values: "_x59 1+0x61"
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-7677-f"}'
        values: "_x59 1+0x61"
    alert_rule_test:
      - eval_time: 100m
        alertname: ServiceAbsent
        exp_alerts: []

  # Kubernetes: a pod lost and not replaced fires under its old name, and
  # resolves once a replacement brings the count back.
  - interval: 1m
    name: ServiceAbsent fires for a pod that is not replaced and resolves when one is
    input_series:
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-7fc4-a"}'
        values: "1+0x120"
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-7fc4-b"}'
        values: "1+0x120"
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-7fc4-c"}'
        values: "1+0x60 _x60"
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-7fc4-d"}'
        values: "_x110 1+0x10"
    alert_rule_test:
      - eval_time: 100m
        alertname: ServiceAbsent
        exp_alerts:
          - exp_labels:
              alertname: ServiceAbsent
              severity: warning
              app: acme
              deployment: d1
              environment: prod
              host: h1
              service: scraper
              instance: scraper-7fc4-c
            exp_annotations:
              summary: "Service instance stopped reporting: scraper/scraper-7fc4-c (prod)"
              description: "'scraper-7fc4-c' of 'scraper' on h1 was being scraped within the last 2h and no longer is, and nothing replaced it: the service runs fewer instances than its 2h median."
      - eval_time: 115m
        alertname: ServiceAbsent
        exp_alerts: []

  # The cost of inferring the inventory: a deliberate scale-down fires until
  # the median catches up, about 1h after the instance went.
  - interval: 1m
    name: ServiceAbsent resolves about 1h after a deliberate scale-down
    input_series:
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper"}'
        values: "1+0x180"
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="scraper",instance="scraper-2"}'
        values: "1+0x60 _x120"
    alert_rule_test:
      - eval_time: 100m
        alertname: ServiceAbsent
        exp_alerts:
          - exp_labels:
              alertname: ServiceAbsent
              severity: warning
              app: acme
              deployment: d1
              environment: prod
              host: h1
              service: scraper
              instance: scraper-2
            exp_annotations:
              summary: "Service instance stopped reporting: scraper/scraper-2 (prod)"
              description: "'scraper-2' of 'scraper' on h1 was being scraped within the last 2h and no longer is, and nothing replaced it: the service runs fewer instances than its 2h median."
      - eval_time: 130m
        alertname: ServiceAbsent
        exp_alerts: []

  # Regression: the agent's label set changed under a running service (0.6.0
  # added `environment`). Cancelling on the full aggregation set left every
  # pre-cutover series uncancellable for the whole 2h window — 22 false
  # positives on one upgrade. Cancel on identity only.
  - interval: 1m
    name: ServiceAbsent stays quiet when the agent's label set changes under a running service
    input_series:
      - series: 'up{job="app",app="acme",deployment="d1",host="h1",service="reports",instance="reports"}'
        values: "1+0x30 _x90"
      - series: 'up{job="app",app="acme",deployment="d1",environment="prod",host="h1",service="reports",instance="reports"}'
        values: "_x31 1+0x89"
    alert_rule_test:
      - eval_time: 90m
        alertname: ServiceAbsent
        exp_alerts: []

  - interval: 1m
    name: ContainerAbsent stays quiet when the agent's label set changes under a running container
    input_series:
      - series: 'container_last_seen{name="reports",id="/docker/aaa",image="reports:1",container_label_com_docker_compose_project="p1",container_label_com_docker_compose_oneoff="False",host="h1"}'
        values: "1+0x30 _x90"
      - series: 'container_last_seen{name="reports",id="/docker/aaa",image="reports:1",container_label_com_docker_compose_project="p1",container_label_com_docker_compose_oneoff="False",app="acme",deployment="d1",environment="prod",host="h1"}'
        values: "_x31 1+0x89"
    alert_rule_test:
      - eval_time: 90m
        alertname: ContainerAbsent
        exp_alerts: []

  # Regression test for the defect this rule was rewritten to fix: Docker mints
  # a new container id on every recreate, so a redeploy permanently orphans the
  # old series. Without aggregating `id` and `image` away, this fires for the
  # full lookback window on every deploy.
  - interval: 1m
    name: ContainerAbsent stays quiet across a redeploy that changes container id and image
    input_series:
      - series: 'container_last_seen{name="reports",id="/docker/aaa",image="reports:1",container_label_com_docker_compose_project="p1",container_label_com_docker_compose_oneoff="False",app="acme",deployment="d1",environment="prod",host="h1"}'
        values: "1+0x30 _x90"
      - series: 'container_last_seen{name="reports",id="/docker/bbb",image="reports:2",container_label_com_docker_compose_project="p1",container_label_com_docker_compose_oneoff="False",app="acme",deployment="d1",environment="prod",host="h1"}'
        values: "_x31 1+0x89"
    alert_rule_test:
      - eval_time: 90m
        alertname: ContainerAbsent
        exp_alerts: []

  - interval: 1m
    name: ContainerAbsent fires when the container is gone for good
    input_series:
      - series: 'container_last_seen{name="reports",id="/docker/aaa",image="reports:1",container_label_com_docker_compose_project="p1",container_label_com_docker_compose_oneoff="False",app="acme",deployment="d1",environment="prod",host="h1"}'
        values: "1+0x60 _x60"
    alert_rule_test:
      - eval_time: 100m
        alertname: ContainerAbsent
        exp_alerts:
          - exp_labels:
              alertname: ContainerAbsent
              severity: warning
              app: acme
              deployment: d1
              environment: prod
              host: h1
              name: reports
            exp_annotations:
              summary: "Container gone: reports on h1"
              description: "'reports' was running on h1 within the last 2h and is no longer reported by cAdvisor."

  # Ephemeral containers must not alert. A bare `docker run` carries no compose
  # project and gets a fresh random name each time, so every one would be a new
  # series that never resolves; a `docker-compose run` one-off is expected to
  # exit. Observed on one dev deployment: 7 such alerts in 2h, all deploy helpers.
  - interval: 1m
    name: ContainerAbsent ignores ephemeral containers that are expected to exit
    input_series:
      - series: 'container_last_seen{name="funny_elion",id="/docker/ccc",image="migrate:1",app="acme",deployment="d1",environment="prod",host="h1"}'
        values: "1+0x60 _x60"
      - series: 'container_last_seen{name="p1_migrate_run_1",id="/docker/ddd",image="migrate:1",container_label_com_docker_compose_project="p1",container_label_com_docker_compose_oneoff="True",app="acme",deployment="d1",environment="prod",host="h1"}'
        values: "1+0x60 _x60"
    alert_rule_test:
      - eval_time: 100m
        alertname: ContainerAbsent
        exp_alerts: []
