apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # slowest collector: node / cAdvisor scrape at Alloy's default 60s. Sets
      # the floor of $__rate_interval (4x) so rate() always spans >= 2 samples.
      timeInterval: 60s

  - name: Prometheus-Meta
    uid: prometheus-meta
    type: prometheus
    access: proxy
    url: http://prometheus-meta:9090
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
