apiVersion: 1

providers:
  - name: soldevelo-monitoring
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
  # Rendered from STAKEHOLDER_DEPLOYMENTS; safe to share externally.
  - name: shared
    orgId: 1
    folder: "Shared externally"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards-shared
