name: soldevelo-monitoring-agents

# One Alloy agent per host: discover, collect, push. See README.md.

# The json-file default is unlimited. Kept larger than the stack's 3 x 50m
# because agents run on app hosts, which have the bigger disks — and this is the
# container that must keep reporting while a host fills up: an ENOSPC tears the
# metrics WAL mid-record, and the agent then loops on the torn segment forever
# rather than pushing. Restarting does not clear it; the WAL has to be dropped.
x-logging:
  &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "7"

services:
  alloy:
    image: grafana/alloy:${ALLOY_VERSION}
    restart: unless-stopped
    logging: *default-logging
    # Pins `instance` on the agent's own exporter targets. Without it the
    # container ID is used, so recreating the agent orphans every series it
    # produced and AgentAbsent fires for a routine upgrade.
    hostname: ${TARGET_NAME}
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
    environment:
      APP: ${APP}
      DEPLOYMENT: ${DEPLOYMENT}
      ENVIRONMENT: ${ENVIRONMENT}
      TARGET_NAME: ${TARGET_NAME}
      INGEST_METRICS_URL: ${INGEST_METRICS_URL}
      INGEST_LOGS_URL: ${INGEST_LOGS_URL}
      INGEST_TOKEN: ${INGEST_TOKEN}
    privileged: true          # cAdvisor cgroup/device access
    pid: host                 # unix exporter sees host processes
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # unix (node) exporter
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      # cAdvisor
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - alloy-data:/var/lib/alloy
    devices:
      - /dev/kmsg
    networks:
      # join the app network to reach container IPs
      - local-cfp-net

volumes:
  alloy-data:

networks:
  local-cfp-net:
    external: true
