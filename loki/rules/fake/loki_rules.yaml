# Path note: the parent directory is named `fake` because that's the literal
# default tenant ID Loki uses when auth_enabled=false. The ruler looks up
# rules under <rules_directory>/<tenant_id>/, and our setup is single-tenant.
# Don't rename `fake/` unless you also enable Loki multi-tenancy.
groups:
  - name: log-errors
    rules:
      - alert: ErrorLogsSpike
        expr: |
          sum by (container, host) (
            rate({container=~".+"} |~ "(?i)\\berror\\b" [5m])
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Error-log spike in {{ $labels.container }} on {{ $labels.host }}"
          description: "'{{ $labels.container }}' on {{ $labels.host }} logged >0.5 error lines/sec for 2m."

  - name: jvm-failure-signals
    # Log-pattern alerts for JVM unrecoverable conditions. These catch the
    # in-process OOM case where the container itself stays "up" but the JVM
    # is wedged.
    #
    # IMPORTANT: patterns deliberately use the fully-qualified class name
    # `java.lang.X` rather than the bare class name. Loki's own ruler logs
    # contain the query text (which embeds the pattern) and alert names —
    # matching `OutOfMemoryError` alone caused a feedback loop where the
    # rule fired on Loki's own logs about the rule. Real JVM crashes always
    # print `java.lang.OutOfMemoryError`, so this loses no real signal.
    rules:
      - alert: JvmOutOfMemoryError
        expr: |
          sum by (container, host) (
            count_over_time({container=~".+"} |~ `java\.lang\.OutOfMemoryError` [5m])
          ) > 0
        labels:
          severity: critical
        annotations:
          summary: "JVM OutOfMemoryError in {{ $labels.container }}"
          description: "java.lang.OutOfMemoryError logged in '{{ $labels.container }}' on {{ $labels.host }}."

      - alert: JvmGCOverheadLimit
        # GC-overhead variant of OOM. Distinct alert because the response
        # differs (leak-hunt, not scale-up). Full JVM line:
        # `java.lang.OutOfMemoryError: GC overhead limit exceeded`.
        expr: |
          sum by (container, host) (
            count_over_time({container=~".+"} |~ `java\.lang\.OutOfMemoryError: GC overhead limit exceeded` [5m])
          ) > 0
        labels:
          severity: critical
        annotations:
          summary: "JVM GC overhead limit exceeded in {{ $labels.container }}"
          description: "'{{ $labels.container }}' on {{ $labels.host }} logged GC overhead limit exceeded."

      - alert: JvmStackOverflowError
        expr: |
          sum by (container, host) (
            count_over_time({container=~".+"} |~ `java\.lang\.StackOverflowError` [5m])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "JVM StackOverflowError in {{ $labels.container }}"
          description: "java.lang.StackOverflowError logged in '{{ $labels.container }}' on {{ $labels.host }}."

      - alert: JvmFatalSignal
        # Catches Hotspot fatal-error preambles (SIGSEGV / native / JVM bug).
        expr: |
          sum by (container, host) (
            count_over_time({container=~".+"} |~ "fatal error has been detected by the Java Runtime" [5m])
          ) > 0
        labels:
          severity: critical
        annotations:
          summary: "JVM hotspot fatal error in {{ $labels.container }}"
          description: "'{{ $labels.container }}' on {{ $labels.host }} logged a Hotspot fatal-error preamble."
