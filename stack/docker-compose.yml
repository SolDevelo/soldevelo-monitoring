name: soldevelo-monitoring

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    restart: unless-stopped
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - ../prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    extra_hosts:
      # Enables `host.docker.internal` to resolve to the Docker host on Linux.
      # Use it as TARGET_HOST when running stack and agents on the same machine.
      - "host.docker.internal:host-gateway"

  prometheus-meta:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    restart: unless-stopped
    volumes:
      - ../prometheus/prometheus-meta.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules_meta:/etc/prometheus/rules:ro
      - prometheus-meta-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
    ports:
      - "9091:9090"
    extra_hosts:
      # Needed to scrape node-exporter which is now in network_mode: host.
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:${LOKI_VERSION}
    restart: unless-stopped
    volumes:
      - ../loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ../loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION}
    restart: unless-stopped
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"

  blackbox:
    image: prom/blackbox-exporter:${BLACKBOX_VERSION}
    restart: unless-stopped
    volumes:
      - ../blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    ports:
      - "9115:9115"
    extra_hosts:
      # Probe targets like http://host.docker.internal:<port> resolve to the Docker host.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${MONITORING_SITE}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DEFAULT_INSTANCE_NAME: "SolDevelo Monitoring"
      GF_USERS_DEFAULT_HOME_DASHBOARD_UID: sdm-home
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  # Reverse proxy in front of Grafana. Auto-HTTPS via Caddy's built-in ACME
  # client (Let's Encrypt) for real domains; plain HTTP or self-signed for
  # localhost. One Caddyfile works for both — switch MONITORING_SITE in .env.
  caddy:
    image: caddy:${CADDY_VERSION}
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - grafana

  # Self-monitoring: node-exporter + cadvisor on the monitoring host itself,
  # scraped by prometheus-meta so we get alerted when the monitor is the problem.
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    restart: unless-stopped
    # network_mode: host needed so netdev/netclass collectors see real host
    # interfaces (not the container's own netns). Listens on :9101 to avoid
    # colliding with the agents node-exporter (port 9100) when stack and
    # agents share a Docker host during local testing.
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=:9101"
    volumes:
      - "/:/host:ro,rslave"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION}
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    devices:
      - /dev/kmsg

volumes:
  prometheus-data:
  prometheus-meta-data:
  loki-data:
  alertmanager-data:
  grafana-data:
  caddy-data:
  caddy-config:
