name: soldevelo-monitoring

# The json-file default is unlimited. Loki and cAdvisor alone add ~31 MB/day of
# container log on a monitoring host, whose root volume is typically far smaller
# than the app hosts' — and a monitoring stack that fills its own disk takes the
# disk alerting down with it. 3 x 50m keeps ~6 days of the noisiest service.
x-logging:
  &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      # `:z` relabels bind-mounted config for SELinux-enforcing hosts
      # (Amazon Linux, RHEL, Fedora). No-op on Ubuntu/Debian.
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ../prometheus/rules:/etc/prometheus/rules:ro,z
      - ../prometheus/targets:/etc/prometheus/targets:ro,z
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    # Loopback only: the remote-write receiver has no auth, Caddy's bearer
    # gate on /ingest/* is the only public path. Same for every port below.
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # Enables `host.docker.internal` to resolve to the Docker host on Linux.
      # Handy when something on the host itself must be reached from Prometheus.
      - "host.docker.internal:host-gateway"

  prometheus-meta:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ../prometheus/prometheus-meta.yml:/etc/prometheus/prometheus.yml:ro,z
      - ../prometheus/rules_meta:/etc/prometheus/rules:ro,z
      - prometheus-meta-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
    ports:
      - "127.0.0.1:9091:9090"
    extra_hosts:
      # Needed to scrape node-exporter which is now in network_mode: host.
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:${LOKI_VERSION}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ../loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro,z
      - ../loki/rules:/etc/loki/rules:ro,z
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "127.0.0.1:3100:3100"

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"

  blackbox:
    image: prom/blackbox-exporter:${BLACKBOX_VERSION}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ../blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro,z
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    ports:
      - "127.0.0.1:9115:9115"
    extra_hosts:
      # Probe targets like http://host.docker.internal:<port> resolve to the Docker host.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${MONITORING_SITE}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DEFAULT_INSTANCE_NAME: "SolDevelo Monitoring"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/home.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_HELP_ENABLED: "false"
      GF_PROFILE_ENABLED: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

  # Reverse proxy in front of Grafana. Auto-HTTPS via Caddy's built-in ACME
  # client (Let's Encrypt) for real domains; plain HTTP or self-signed for
  # localhost. One Caddyfile works for both — switch MONITORING_SITE in .env.
  caddy:
    image: caddy:${CADDY_VERSION}
    restart: unless-stopped
    logging: *default-logging
    # Same number inside and out: MONITORING_SITE's port is what Caddy listens
    # on, so a remap (CADDY_HTTP_PORT=8080 + http://localhost:8080) must match.
    ports:
      - "${CADDY_HTTP_PORT:-80}:${CADDY_HTTP_PORT:-80}"
      - "${CADDY_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - grafana

  # Self-monitoring: node-exporter + cadvisor on the monitoring host itself,
  # scraped by prometheus-meta so we get alerted when the monitor is the problem.
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    restart: unless-stopped
    logging: *default-logging
    # network_mode: host needed so netdev/netclass collectors see real host
    # interfaces (not the container's own netns). Listens on :9101.
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=:9101"
    volumes:
      - "/:/host:ro,rslave"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION}
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    devices:
      - /dev/kmsg

volumes:
  prometheus-data:
  prometheus-meta-data:
  loki-data:
  alertmanager-data:
  grafana-data:
  caddy-data:
  caddy-config:
