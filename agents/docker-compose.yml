name: soldevelo-monitoring-agents

# Drops onto a target server to expose host + container metrics and ship logs
# to the central monitoring host. Pair with stack/ on the monitoring host.

services:
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    restart: unless-stopped
    # network_mode: host is required for the netdev/netclass collectors to
    # see the real host interfaces. Without it, node-exporter reports metrics
    # from its own container's network namespace, which only carries scrape
    # traffic and looks suspiciously idle.
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=:${TARGET_NODE_EXPORTER_PORT}"
    volumes:
      - "/:/host:ro,rslave"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION}
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    devices:
      - /dev/kmsg
    ports:
      - "${TARGET_CADVISOR_PORT}:8080"

  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION}
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro,z
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/promtail-config.yaml
    extra_hosts:
      # Use MONITORING_SERVER_HOST=host.docker.internal when stack and agents
      # share a Docker host.
      - "host.docker.internal:host-gateway"

volumes:
  promtail-positions:
